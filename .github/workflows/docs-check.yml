name: Docs Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check core files exist
        run: |
          missing=0
          for f in README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md LICENSE CITATION.cff ROADMAP.md; do
            [ -f "$f" ] || { echo "Missing: $f"; missing=1; }
          done
          exit $missing
      - name: Check relative Markdown links
        run: python3 tools/check_links.py
