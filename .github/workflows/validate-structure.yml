name: Validate Repository Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required directories and policy files
        run: |
          missing=0
          for dir in docs research platform policy strategy datasets models tools community media; do
            [ -d "$dir" ] || { echo "Missing directory: $dir/"; missing=1; }
          done
          for f in policy/hres649.md policy/ethics-charter.md policy/regional-frameworks.md; do
            [ -f "$f" ] || { echo "Missing file: $f"; missing=1; }
          done
          exit $missing
